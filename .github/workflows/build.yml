name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew :composeApp:assembleDebug

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-android-debug
        path: composeApp/build/outputs/apk/debug/*.apk
        retention-days: 30

  build-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            task: packageDeb
            artifact-path: composeApp/build/compose/binaries/main/deb/*.deb
            artifact-name: JokeCamera-linux
          - os: macos-latest
            task: packageDmg
            artifact-path: composeApp/build/compose/binaries/main/dmg/*.dmg
            artifact-name: JokeCamera-macos
          - os: windows-latest
            task: packageMsi
            artifact-path: composeApp/build/compose/binaries/main/msi/*.msi
            artifact-name: JokeCamera-windows
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      if: matrix.os != 'windows-latest'
      run: chmod +x gradlew

    - name: Build Desktop (${{ matrix.os }})
      run: ./gradlew :composeApp:${{ matrix.task }}

    - name: Upload Desktop Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.artifact-path }}
        retention-days: 30

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Web (Wasm)
      run: ./gradlew :composeApp:wasmJsBrowserDistribution

    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-web
        path: composeApp/build/dist/wasmJs/productionExecutable/
        retention-days: 30
