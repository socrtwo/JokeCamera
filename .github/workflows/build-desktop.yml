name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Windows installer
      working-directory: desktop
      run: npm run build:win

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-windows
        path: |
          desktop/dist/*.exe
          desktop/dist/*.msi
        retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build macOS DMG
      working-directory: desktop
      run: npm run build:mac

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-macos
        path: desktop/dist/*.dmg
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Linux packages
      working-directory: desktop
      run: npm run build:linux

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-linux
        path: |
          desktop/dist/*.AppImage
          desktop/dist/*.deb
        retention-days: 30

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release with desktop builds
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/JokeCamera-windows/*
          artifacts/JokeCamera-macos/*
          artifacts/JokeCamera-linux/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
