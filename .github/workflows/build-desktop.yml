name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    environment: release

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Windows installer
      working-directory: desktop
      run: npm run build:win

    - name: Azure login (OIDC, no stored secret)
      if: vars.AZURE_TENANT_ID != ''
      uses: azure/login@v2
      with:
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - name: Sign Windows binaries with Azure Trusted Signing
      if: vars.AZURE_TENANT_ID != ''
      uses: azure/trusted-signing-action@v0.5.1
      with:
        endpoint: ${{ vars.TS_ENDPOINT }}
        trusted-signing-account-name: ${{ vars.TS_ACCOUNT_NAME }}
        certificate-profile-name: ${{ vars.TS_CERT_PROFILE }}
        files-folder: desktop/dist
        files-folder-filter: exe
        files-folder-recurse: true
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-windows
        path: |
          desktop/dist/*.exe
          desktop/dist/*.msi
        retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build macOS DMG
      working-directory: desktop
      run: npm run build:mac

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-macos
        path: desktop/dist/*.dmg
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Linux packages
      working-directory: desktop
      run: npm run build:linux

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-linux
        path: |
          desktop/dist/*.AppImage
          desktop/dist/*.deb
        retention-days: 30

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release with desktop builds
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: false
        files: |
          artifacts/JokeCamera-windows/*
          artifacts/JokeCamera-macos/*
          artifacts/JokeCamera-linux/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
