name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Android APK
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-android
        path: app/build/outputs/apk/debug/app-debug.apk

  # Web App
  build-web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Package Web App
      run: |
        cd web
        zip -r ../JokeCamera-web.zip .

    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-web
        path: JokeCamera-web.zip

  # Windows Desktop
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Windows
      working-directory: desktop
      run: npm run build:win

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-windows
        path: |
          desktop/dist/*.exe

  # macOS Desktop
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build macOS
      working-directory: desktop
      run: npm run build:mac

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-macos
        path: desktop/dist/*.dmg

  # Linux Desktop
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Linux
      working-directory: desktop
      run: npm run build:linux

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-linux
        path: |
          desktop/dist/*.AppImage
          desktop/dist/*.deb

  # ChromeOS (web app + install instructions)
  build-chromeos:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Package ChromeOS App
      run: |
        mkdir -p pkg-chromeos
        cp -r web/. pkg-chromeos/
        printf '%s\n' \
          '# Joke Camera on ChromeOS' \
          '' \
          '## Recommended: install the hosted app' \
          '' \
          '1. Open https://socrtwo.github.io/JokeCamera/ in Chrome.' \
          '2. Click the Install icon in the address bar (right-hand side).' \
          '3. Joke Camera is added to your launcher and runs in its own window.' \
          '' \
          '## Offline alternative' \
          '' \
          'Unzip this archive and open `index.html` in Chrome.' \
          > pkg-chromeos/INSTALL.md
        cd pkg-chromeos
        zip -r ../JokeCamera-chromeos.zip .

    - name: Upload ChromeOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-chromeos
        path: JokeCamera-chromeos.zip

  # iOS install bundle (web app + Add to Home Screen instructions)
  build-ios-pwa:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Package iOS App
      run: |
        mkdir -p pkg-ios
        cp -r web/. pkg-ios/
        printf '%s\n' \
          '# Joke Camera on iOS / iPadOS' \
          '' \
          '## Recommended: add the hosted app to your Home Screen' \
          '' \
          '1. Open https://socrtwo.github.io/JokeCamera/ in Safari.' \
          '2. Tap the Share button.' \
          '3. Tap "Add to Home Screen", then "Add".' \
          '4. Launch Joke Camera from the Home Screen icon like a native app.' \
          '' \
          '## Native build' \
          '' \
          'A native Xcode project is available in the `ios/` directory of the' \
          'repository for developers who want to build and sign the native app:' \
          'https://github.com/socrtwo/JokeCamera/tree/main/ios' \
          > pkg-ios/INSTALL.md
        cd pkg-ios
        zip -r ../JokeCamera-ios.zip .

    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-ios
        path: JokeCamera-ios.zip

  # iOS (simulator build only - App Store requires signing)
  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build iOS (Simulator)
      working-directory: ios
      run: |
        xcodebuild build \
          -project JokeCamera.xcodeproj \
          -scheme JokeCamera \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

  # Create GitHub Release with all artifacts
  release:
    needs: [build-android, build-web, build-windows, build-macos, build-linux, build-ios, build-chromeos, build-ios-pwa]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: false
        files: |
          artifacts/JokeCamera-android/app-debug.apk
          artifacts/JokeCamera-web/JokeCamera-web.zip
          artifacts/JokeCamera-windows/*
          artifacts/JokeCamera-macos/*
          artifacts/JokeCamera-linux/*
          artifacts/JokeCamera-chromeos/JokeCamera-chromeos.zip
          artifacts/JokeCamera-ios/JokeCamera-ios.zip
        body: |
          ## Joke Camera - Multi-Platform Release

          ### Downloads
          - **Android**: `app-debug.apk` - Install directly on Android device
          - **Windows**: `.exe` installer
          - **macOS**: `.dmg` disk image
          - **Linux**: `.AppImage` or `.deb` package
          - **Web**: `JokeCamera-web.zip` - Extract and open `index.html`, or deploy to any web server
          - **ChromeOS**: `JokeCamera-chromeos.zip` - Web app + install instructions (open https://socrtwo.github.io/JokeCamera/ in Chrome and click the Install icon in the address bar, or unzip and open `index.html`)
          - **iOS**: `JokeCamera-ios.zip` - Web app + install instructions (open https://socrtwo.github.io/JokeCamera/ in Safari → Share → Add to Home Screen); native Xcode project in `ios/` for source builds

          ### What's New
          - Multi-platform support: Android, iOS, Windows, macOS, Linux, Web
          - 451 built-in jokes across 4 categories
          - Face detection with smile/laugh capture
          - Text-to-Speech joke narration
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
