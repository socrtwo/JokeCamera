name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Android APK
  build-android:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-android
        path: app/build/outputs/apk/debug/app-debug.apk

  # Web App
  build-web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Package Web App
      run: |
        cd web
        zip -r ../JokeCamera-web.zip .

    - name: Upload Web artifact
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-web
        path: JokeCamera-web.zip

  # Windows Desktop
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Windows
      working-directory: desktop
      run: npm run build:win

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-windows
        path: |
          desktop/dist/*.exe

  # macOS Desktop
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build macOS
      working-directory: desktop
      run: npm run build:mac

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-macos
        path: desktop/dist/*.dmg

  # Linux Desktop
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: desktop
      run: npm install

    - name: Build Linux
      working-directory: desktop
      run: npm run build:linux

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-linux
        path: |
          desktop/dist/*.AppImage
          desktop/dist/*.deb

  # iOS (simulator build only - App Store requires signing)
  build-ios:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build iOS (Simulator)
      working-directory: ios
      run: |
        xcodebuild build \
          -project JokeCamera.xcodeproj \
          -scheme JokeCamera \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

  # Create GitHub Release with all artifacts
  release:
    needs: [build-android, build-web, build-windows, build-macos, build-linux, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/JokeCamera-android/app-debug.apk
          artifacts/JokeCamera-web/JokeCamera-web.zip
          artifacts/JokeCamera-windows/*
          artifacts/JokeCamera-macos/*
          artifacts/JokeCamera-linux/*
        body: |
          ## Joke Camera - Multi-Platform Release

          ### Downloads
          - **Android**: `app-debug.apk` - Install directly on Android device
          - **Windows**: `.exe` installer
          - **macOS**: `.dmg` disk image
          - **Linux**: `.AppImage` or `.deb` package
          - **Web**: `JokeCamera-web.zip` - Extract and open `index.html`, or deploy to any web server
          - **iOS**: Build from source with Xcode (see `ios/` directory)

          ### What's New
          - Multi-platform support: Android, iOS, Windows, macOS, Linux, Web
          - 451 built-in jokes across 4 categories
          - Face detection with smile/laugh capture
          - Text-to-Speech joke narration
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
