name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore (if signing secrets provided)
      if: env.KEYSTORE_BASE64 != ''
      run: |
        mkdir -p build
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > build/keystore.jks
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Build Release AAB (Android App Bundle)
      run: ./gradlew bundleRelease
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Rename artifacts
      run: |
        VERSION="${{ github.ref_name }}"
        cp app/build/outputs/apk/release/app-release*.apk \
           app/build/outputs/apk/release/JokeCamera-${VERSION}.apk || \
        cp app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/JokeCamera-${VERSION}.apk
        cp app/build/outputs/bundle/release/app-release.aab \
           app/build/outputs/bundle/release/JokeCamera-${VERSION}.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-release-apk
        path: app/build/outputs/apk/release/JokeCamera-*.apk
        retention-days: 90

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: JokeCamera-release-aab
        path: app/build/outputs/bundle/release/JokeCamera-*.aab
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/release/JokeCamera-*.apk
          app/build/outputs/bundle/release/JokeCamera-*.aab
        generate_release_notes: true
        body: |
          ## Installation

          ### Direct install (APK)
          Download the `.apk` file and sideload it on your Android device
          (enable "Install from unknown sources" in Settings → Security).

          ### Google Play (AAB)
          The `.aab` file is for uploading to the Google Play Store.

          ## Requirements
          - Android 7.0 (API 24) or higher
          - Camera hardware
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
